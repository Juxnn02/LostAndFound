services:
  - type: web
    name: lostandfound
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python init.py && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lostandfound-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false

databases:
  - name: lostandfound-db
    databaseName: lostandfound
    user: lostandfound

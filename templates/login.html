<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/auth.css">
</head>
<body>

<h2>
    Lost
    <img src="static/magnify glass.png" alt="Magnifying glass icon">
    Found
</h2>

<div class="auth-container">
    <h3>Sign into your account</h3>

    <p id="login-error" class="auth-error"></p>

    <form onsubmit="handleLoginSubmit(event)">
        <div class="auth-input-group">
            <label for="login-email">School Email</label>
            <input type="email" id="login-email" placeholder="you@southernct.edu" required>
        </div>

        <div class="auth-input-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
        </div>

        <button class="auth-signin-button" type="submit">Sign In</button>
    </form>

    <p class="auth-links">
        <a href="/register">Don't have an account? Register</a><br>
        <a href="/forgot-password" class="auth-link">Forgot your password?</a>
    </p>
</div>

<script src="static/validation.js"></script>
<script src="static/login.js"></script>
</body>
</html>

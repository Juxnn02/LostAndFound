<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/app.css">
    <link rel="stylesheet" href="static/messages.css">
</head>
<body class="app-layout">

    <div class="messages-header">
        <a href="/dashboard" class="back-link-messages">&larr; Back</a>
        <h1>Messages</h1>
    </div>

    <div class="messenger-wrapper">

        <!-- LEFT: Conversation list -->
        <aside class="inbox-list" id="inbox-list">
            <div class="inbox-empty" id="inbox-empty">
                <p>No conversations yet.</p>
                <a href="/dashboard">Browse listings</a>
            </div>
        </aside>

        <!-- RIGHT: Chat panel -->
        <section class="chat-main">

            <div class="chat-header" id="chat-header">
                <span id="chat-header-name"></span>
                <span id="chat-header-listing"></span>
            </div>

            <div class="chat-display" id="chat-box">
                <p class="empty-chat-text">Select a conversation to start chatting.</p>
            </div>

            <form class="message-input" id="message-form" onsubmit="return handleSend(event)">
                <input type="text" id="user-input" placeholder="Write a message..." autocomplete="off" disabled>
                <button type="submit" id="send-btn" disabled>Send</button>
            </form>

        </section>

    </div>

    <script src="static/timeformat.js"></script>
    <script src="static/messages.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/app.css">
    <link rel="stylesheet" href="static/messages.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body class="app-layout">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidepanel" id="sidePanel">
    <div class="sidepanel-top">
        <div class="profile-header">
            <a href="/profile">
                <div class="avatar" id="sidebar-avatar">{{ user_initials }}</div>
            </a>
            <div class="user-info">
                <h3 id="sidebar-username">{{ user_name }}</h3>
            </div>
        </div>

        <nav class="sidepanel-nav">
            <a href="/dashboard"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
            <a href="/createlisting"><span class="material-symbols-outlined">add</span>New Listing</a>
            <a href="/my_listings"><span class="material-symbols-outlined">list</span>My Listings</a>
            <a href="/messages" class="active"><span class="material-symbols-outlined">chat</span>Messages</a>
            <a href="/feedback"><span class="material-symbols-outlined">star</span>Feedback</a>
        </nav>
    </div>

    <div class="sidepanel-footer">
        <hr> <a href="/"><span class="material-symbols-outlined">logout</span>Logout</a>
    </div>
</aside>

<!-- MOBILE TOPBAR -->
<div class="mobile-topbar">
    <button type="button" class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu">
        <span class="material-symbols-outlined">menu</span>
    </button>
    <span class="mobile-topbar-title">Messages</span>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
    <div class="navbar">
        <h1 class="messages-header">Messages</h1>
    </div>

    <div class="messenger-wrapper">

        <!-- LEFT: Conversation list -->
        <aside class="inbox-list" id="inbox-list">
            <div class="inbox-empty" id="inbox-empty">
                <p>No conversations yet.</p>
                <a href="/dashboard">Browse listings</a>
            </div>
        </aside>

        <!-- RIGHT: Chat panel -->
        <section class="chat-main">

            <!-- Shown when no conversation is selected -->
            <div class="chat-welcome" id="chat-welcome">
                <span class="material-symbols-outlined">forum</span>
                <p>Select a conversation to start chatting</p>
            </div>

            <!-- Shown when a conversation is active -->
            <div class="chat-active" id="chat-active">
                <div class="chat-header" id="chat-header">
                    <span id="chat-header-name"></span>
                    <span id="chat-header-listing"></span>
                </div>

                <div class="chat-display" id="chat-box"></div>

                <form class="message-input" id="message-form" onsubmit="return handleSend(event)">
                    <input type="text" id="user-input" placeholder="Write a message..." autocomplete="off" disabled>
                    <button type="submit" id="send-btn" disabled>Send</button>
                </form>
            </div>

        </section>

    </div>
</div>

<!-- SCRIPTS -->
<script src="static/timeformat.js"></script>
<script src="static/messages.js"></script>

<script>
// ===== Sidebar Profile & Accent Color =====
(function applyProfileSettings() {
    const sidebarAvatar = document.getElementById('sidebar-avatar');
    const sidebarUsername = document.getElementById('sidebar-username');
    const savedColor = localStorage.getItem('profileAccentColor');
    const savedAvatar = localStorage.getItem('profileAvatar');
    const savedUsername = localStorage.getItem('profileUsername');

    if (savedColor) {
        document.documentElement.style.setProperty('--primary', savedColor);
    }

    if (sidebarUsername && savedUsername) {
        sidebarUsername.textContent = savedUsername.split(' ')[0] || savedUsername;
    }

    if (sidebarAvatar) {
        if (savedAvatar) {
            sidebarAvatar.textContent = '';
            const img = document.createElement('img');
            img.src = savedAvatar;
            img.style.width = '40px';
            img.style.height = '40px';
            img.style.borderRadius = '50%';
            sidebarAvatar.appendChild(img);
        } else if (savedUsername) {
            const initials = savedUsername
                .split(' ')
                .map(n => n[0])
                .join('')
                .toUpperCase()
                .slice(0,2);
            sidebarAvatar.textContent = initials;
            if (initials.length === 1) sidebarAvatar.style.fontSize = '18px';
        }
    }
})();

// ===== Sidebar toggle =====
function toggleSidebar() {
    document.getElementById('sidePanel').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
}
function closeSidebar() {
    document.getElementById('sidePanel').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('active');
}

// ===== Scroll chat to bottom helper =====
function scrollToBottom(element) {
    if(element) element.scrollTop = element.scrollHeight;
}
</script>

</body>
</html>

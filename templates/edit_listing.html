<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing — Lost &amp; Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="static/app.css">
</head>
<body class="app-layout">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidepanel" id="sidePanel">
    <div class="sidepanel-top">
        <div class="profile-header">
            <a href="/profile">
                <div class="avatar">{{ user_initials }}</div>
            </a>
            <div class="user-info">
                <h3>{{ user_name }}</h3>
            </div>
        </div>

        <nav class="sidepanel-nav">
            <a href="/dashboard"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
            <a href="/createlisting"><span class="material-symbols-outlined">add</span>New Listing</a>
            <a href="/my_listings" class="active"><span class="material-symbols-outlined">list</span>My Listings</a>
            <a href="/messages"><span class="material-symbols-outlined">chat</span>Messages</a>
            <a href="/feedback"><span class="material-symbols-outlined">star</span>Feedback</a>
        </nav>
    </div>
    <div class="sidepanel-footer">
        <hr> <a href="/"><span class="material-symbols-outlined">logout</span>Logout</a>
    </div>
</aside>

<div class="page-content">
    <div class="mobile-topbar">
        <button type="button" class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="mobile-topbar-title">Edit Listing</span>
    </div>

    <div class="edit-listing-header">
        <h1>Edit Listing</h1>
    </div>

    <form class="form-container" id="edit-listing-form">

        <div class="form-content">
            <div class="form-group">
                <label for="listing-date">Date:</label>
                <input type="date" id="listing-date" value="{{ post.post_date.strftime('%Y-%m-%d') }}" required>
            </div>

            <div class="form-group">
                <label for="listing-category">Category:</label>
                <select id="listing-category" required title="Select the item category">
                    <option value="">— Select —</option>
                    <option value="Accessories" {% if post.category == 'Accessories' %}selected{% endif %}>Accessories</option>
                    <option value="Apparel" {% if post.category == 'Apparel' %}selected{% endif %}>Apparel</option>
                    <option value="Books" {% if post.category == 'Books' %}selected{% endif %}>Books</option>
                    <option value="Electronics" {% if post.category == 'Electronics' %}selected{% endif %}>Electronics</option>
                    <option value="Other" {% if post.category == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="listing-location">Found at / Lost at:</label>
                <select id="listing-location" required title="Select the location where item was found or lost">
                    <option value="">— Select location —</option>
                    <option value="Buley Library" {% if post.location == 'Buley Library' %}selected{% endif %}>Buley Library</option>
                    <option value="Engleman Hall" {% if post.location == 'Engleman Hall' %}selected{% endif %}>Engleman Hall</option>
                    <option value="Jennings Hall" {% if post.location == 'Jennings Hall' %}selected{% endif %}>Jennings Hall</option>
                    <option value="Morrill Hall" {% if post.location == 'Morrill Hall' %}selected{% endif %}>Morrill Hall</option>
                    <option value="Student Center" {% if post.location == 'Student Center' %}selected{% endif %}>Student Center</option>
                    <option value="A Resident Hall" {% if post.location == 'A Resident Hall' %}selected{% endif %}>A Resident Hall</option>
                    <option value="Outside/Grounds" {% if post.location == 'Outside/Grounds' %}selected{% endif %}>Outside/Grounds</option>
                    <option value="Other" {% if post.location == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="listing-description">Description:</label>
                <textarea id="listing-description" required rows="4">{{ post.description }}</textarea>
            </div>

            <div class="form-group">
                <div class="form-buttons">
                    <button type="button" class="btn-form btn-cancel-form" onclick="location.href='/my_listings'">Cancel</button>
                    <button type="submit" class="btn-form btn-save">Save</button>
                </div>
            </div>
        </div>

        <div class="form-right-column">
            <div class="form-group">
                <label for="listing-title">Title:</label>
                <input type="text" id="listing-title" value="{{ post.item_name }}" required>
            </div>

            <div class="form-group">
                <label>Update Image</label>
                <input type="file" id="listing-image" accept="image/*" title="Select image file">
            </div>

            <div class="form-group">
                <label>Current Image:</label>
                <img id="image-preview" src="{{ post.image_url }}" alt="Current listing image" class="edit-image-preview">
            </div>
        </div>

    </form>
</div>

<script>
function toggleSidebar() {
    document.getElementById('sidePanel').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
}
function closeSidebar() {
    document.getElementById('sidePanel').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('active');
}

document.getElementById('listing-image').addEventListener('change', function() {
    const file = this.files[0];
    const preview = document.getElementById('image-preview');
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    } else {
        preview.src = '';
        preview.style.display = 'none';
    }
});

document.getElementById('edit-listing-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const postId = "{{ post.id }}";
    const formData = new FormData();
    formData.append('item_name', document.getElementById('listing-title').value);
    formData.append('description', document.getElementById('listing-description').value);
    formData.append('category', document.getElementById('listing-category').value);
    formData.append('location', document.getElementById('listing-location').value);
    const imageInput = document.getElementById('listing-image');
    if (imageInput.files.length > 0) {
        formData.append('image', imageInput.files[0]);
    }
    fetch(`/listings/update/${postId}`, {
        method: 'POST',
        body: formData
    }).then(response => response.json())
      .then(data => {
          if (data.success) {
              window.location.href = '/my_listings';
          } else {
              alert('Update failed: ' + data.message);
          }
      }).catch(error => {
          console.error('Error:', error);
          alert('An error occurred.');
      });
});
</script>
</body>
</html>

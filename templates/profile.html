<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="profile-container">
        <button id="back-button" class="btn">Back</button>
        <div class="profile-content">
            <!-- Left Column -->
            <div class="profile-left">
                <img id="user-avatar" src="default-avatar.png" alt="User Avatar" class="avatar-medium">
                <h2 id="username-display">Username</h2>
                <p id="email-display">user@example.com</p>

                <button id="edit-name-btn" class="btn btn-medium">Edit Name</button>
                <button id="save-changes-btn" class="btn btn-medium">Save Changes</button>
                <button id="logout-btn" class="btn btn-medium">Logout</button>
                <button id="delete-account-btn" class="btn btn-medium btn-danger">Delete Account</button>
            </div>

            <!-- Right Column -->
            <div class="profile-right">
                <h3>Appearance</h3>
                <label for="button-color">Button Color:</label>
                <input type="color" id="button-color" list="color-options">

                <datalist id="color-options">
                    <option value="#007bff"></option>
                    <option value="#28a745"></option>
                    <option value="#ffc107"></option>
                    <option value="#17a2b8"></option>
                    <option value="#6f42c1"></option>
                    <option value="#fd7e14"></option>
                    <option value="#e83e8c"></option>
                    <!-- exclude black (#000000) and white (#ffffff) -->
                </datalist>

                <label for="avatar-input">Profile Image:</label>
                <input type="file" id="avatar-input" accept="image/*" style="display:none">
                <button id="upload-avatar-btn" class="btn btn-medium">Choose Image</button>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script src="profile.js"></script>
</body>
</html>

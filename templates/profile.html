<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        :root {
            --button-bg: {{ user.get('button_color', '#007bff') }};
            --button-hover: #ffffff;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #007bff;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            margin: 0 auto 1rem;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="app-layout">

<button class="back-btn" onclick="location.href='/dashboard'">
    <span class="material-symbols-outlined">arrow_back</span> Back
</button>

<div class="profile-container">
    <div class="avatar" id="avatar" aria-label="User Avatar">
        {{ user_initials }}
    </div>

    <h2>{{ user_name or 'Guest' }}</h2>
    <p>{{ user_email }}</p>

    <input type="text" id="name-input" class="profile-input" placeholder="Enter your name" value="{{ user_name }}">

    <div class="profile-buttons">
        <button id="save-btn">Save Changes</button>
        <button id="logout-btn">Logout</button>
        <button id="delete-btn" class="delete-btn">Delete Account</button>
    </div>

    <div class="appearance-section">
        <h3>Appearances</h3>
        <label for="button-color">Button Color:</label>
        <input type="color" id="button-color" value="{{ user.get('button_color', '#007bff') }}">
    </div>
</div>

<input type="file" id="avatar-upload" accept="image/*" style="display:none">
<script src="{{ url_for('static', filename='profile.js') }}"></script>
</body>
</html>
